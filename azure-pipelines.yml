# ==========================================
# CI/CD Pipeline
# GitHub → Docker → ACR → AKS
# Development → QA → Production
# ==========================================

trigger:
- main


# ==========================================
# VARIABLES
# ==========================================

variables:

  # Docker Registry Service Connection
  dockerRegistryServiceConnection: '8072af9b-e881-4d56-9d7e-3b46abcb6e8b'

  # Azure Resource Manager Service Connection
  azureServiceConnection: 'azure-service-connection'

  # Azure Resource Group
  resourceGroup: 'rg-devops-project'

  # AKS Cluster Name
  aksCluster: 'aks-devops-project'

  # ACR Image Repository Name
  imageRepository: 'pankajkumardevdevopsrealtimeproject'

  # Azure Container Registry
  containerRegistry: 'pankajacr12345.azurecr.io'

  # Dockerfile Path
  dockerfilePath: '$(Build.SourcesDirectory)/BankingApp/Dockerfile'

  # Docker Image Tag
  tag: '$(Build.BuildId)'

  # Build Agent
  vmImageName: 'ubuntu-latest'


# ==========================================
# STAGES
# ==========================================

stages:


# ==========================================
# STAGE 1
# BUILD AND PUSH IMAGE TO ACR
# ==========================================

- stage: Build

  displayName: 'Build and Push to ACR'

  jobs:

  - job: BuildDockerImage

    displayName: 'Build Docker Image'

    pool:
      vmImage: $(vmImageName)

    steps:

    # Checkout Source Code
    - checkout: self

      displayName: 'Checkout Source Code'


    # Build and Push Docker Image
    - task: Docker@2

      displayName: 'Build and Push Docker Image to ACR'

      inputs:

        command: buildAndPush

        repository: $(imageRepository)

        dockerfile: $(dockerfilePath)

        containerRegistry: $(dockerRegistryServiceConnection)

        tags: |
          $(tag)



# ==========================================
# STAGE 2
# DEPLOY TO DEVELOPMENT
# ==========================================

- stage: Development

  displayName: 'Deploy to Development'

  dependsOn: Build

  jobs:

  - deployment: DeployToDevelopment

    displayName: 'Deploy to Development'

    environment: 'Development'

    pool:
      vmImage: $(vmImageName)

    strategy:

      runOnce:

        deploy:

          steps:

          # Checkout Repository
          - checkout: self

            displayName: 'Checkout Repository'


          # Deploy to AKS
          - task: KubernetesManifest@1

            displayName: 'Deploy Application to Development'

            inputs:

              action: deploy

              connectionType: azureResourceManager

              azureSubscriptionConnection: $(azureServiceConnection)

              azureResourceGroup: $(resourceGroup)

              kubernetesCluster: $(aksCluster)

              manifests: |
                $(Build.SourcesDirectory)/k8s/deployment.yaml
                $(Build.SourcesDirectory)/k8s/service.yaml

              containers: |
                $(containerRegistry)/$(imageRepository):$(tag)



# ==========================================
# STAGE 3
# DEPLOY TO QA
# ==========================================

- stage: QA

  displayName: 'Deploy to QA'

  dependsOn: Development

  jobs:

  - deployment: DeployToQA

    displayName: 'Deploy to QA'

    environment: 'QA'

    pool:
      vmImage: $(vmImageName)

    strategy:

      runOnce:

        deploy:

          steps:

          # Checkout Repository
          - checkout: self

            displayName: 'Checkout Repository'


          # Deploy to AKS
          - task: KubernetesManifest@1

            displayName: 'Deploy Application to QA'

            inputs:

              action: deploy

              connectionType: azureResourceManager

              azureSubscriptionConnection: $(azureServiceConnection)

              azureResourceGroup: $(resourceGroup)

              kubernetesCluster: $(aksCluster)

              manifests: |
                $(Build.SourcesDirectory)/k8s/deployment.yaml
                $(Build.SourcesDirectory)/k8s/service.yaml

              containers: |
                $(containerRegistry)/$(imageRepository):$(tag)



# ==========================================
# STAGE 4
# DEPLOY TO PRODUCTION
# APPROVAL REQUIRED
# ==========================================

- stage: Production

  displayName: 'Deploy to Production'

  dependsOn: QA

  jobs:

  - deployment: DeployToProduction

    displayName: 'Deploy to Production'


    # Azure DevOps Environment
    # Production Approval Check will work here
    environment: 'Production'

    pool:
      vmImage: $(vmImageName)

    strategy:

      runOnce:

        deploy:

          steps:

          # Checkout Repository
          - checkout: self

            displayName: 'Checkout Repository'


          # Deploy to AKS
          - task: KubernetesManifest@1

            displayName: 'Deploy Application to Production'

            inputs:

              action: deploy

              connectionType: azureResourceManager

              azureSubscriptionConnection: $(azureServiceConnection)

              azureResourceGroup: $(resourceGroup)

              kubernetesCluster: $(aksCluster)

              manifests: |
                $(Build.SourcesDirectory)/k8s/deployment.yaml
                $(Build.SourcesDirectory)/k8s/service.yaml

              containers: |
                $(containerRegistry)/$(imageRepository):$(tag)